<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenMindAI promotional banner</title>
  <desc id="desc">OpenMindAI local and privacy-first AI for desktop and mobile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="0.48" stop-color="#0b1b30"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6cc8ff"/>
      <stop offset="1" stop-color="#7cf0b7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102844"/>
      <stop offset="1" stop-color="#081523"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#6cc8ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6cc8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#7cf0b7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7cf0b7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="40" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="40" fill="url(#glowA)"/>
  <rect width="1600" height="560" rx="40" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1598" height="558" rx="39" fill="none" stroke="#31506e" stroke-opacity="0.72"/>

  <g opacity="0.22" stroke="#89dcff">
    <path d="M74 106h278M74 448h350M1190 70h314M1260 490h244"/>
    <circle cx="1372" cy="118" r="66" fill="none"/>
    <circle cx="1372" cy="118" r="92" fill="none" stroke-opacity="0.35"/>
  </g>

  <g transform="translate(82 72)">
    <g>
      <rect width="76" height="76" rx="24" fill="#0f2439" stroke="#4b789a"/>
      <path d="M22 48V28l16-9 16 9v20l-16 9-16-9Z" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="38" cy="38" r="8" fill="url(#accent)"/>
    </g>
    <text x="96" y="49" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="-1.4">OpenMindAI</text>
    <text x="99" y="76" fill="#8db4cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3.8">LOCAL • PRIVATE • OFFLINE-FIRST</text>

    <text x="0" y="158" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1.8">Your AI. Your device.</text>
    <text x="0" y="218" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1.8">Your privacy.</text>

    <text x="0" y="274" fill="#b9cde0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Run capable AI locally for chat, coding, documents and creative workflows.</text>

    <g transform="translate(0 314)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">
      <g><rect width="150" height="42" rx="21" fill="#0d2235" stroke="#2c536d"/><circle cx="20" cy="21" r="5" fill="#7cf0b7"/><text x="34" y="27" fill="#d8e9f5">Local models</text></g>
      <g transform="translate(164 0)"><rect width="148" height="42" rx="21" fill="#0d2235" stroke="#2c536d"/><circle cx="20" cy="21" r="5" fill="#6cc8ff"/><text x="34" y="27" fill="#d8e9f5">Desktop + Mobile</text></g>
      <g transform="translate(326 0)"><rect width="132" height="42" rx="21" fill="#0d2235" stroke="#2c536d"/><circle cx="20" cy="21" r="5" fill="#a9b6ff"/><text x="34" y="27" fill="#d8e9f5">Offline ready</text></g>
    </g>

    <g transform="translate(0 382)">
      <rect width="244" height="54" rx="27" fill="url(#accent)"/>
      <text x="28" y="34" fill="#06111d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Explore openmindai.org</text>
      <path d="M206 20h15v15M220 21l-17 17" fill="none" stroke="#06111d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

