      <rect x="16" y="50" width="424" height="254" rx="12" fill="url(#screen)"/>
      <circle cx="228" cy="43" r="3" fill="#7895aa"/>
      <rect x="36" y="72" width="86" height="14" rx="7" fill="#6cc8ff" fill-opacity="0.8"/>
      <rect x="36" y="105" width="252" height="18" rx="9" fill="#eff8ff" fill-opacity="0.9"/>
      <rect x="36" y="136" width="330" height="10" rx="5" fill="#8299ad" fill-opacity="0.55"/>
      <rect x="36" y="156" width="294" height="10" rx="5" fill="#8299ad" fill-opacity="0.38"/>
      <rect x="36" y="194" width="178" height="72" rx="16" fill="#0c2134" stroke="#31526e"/>
      <rect x="231" y="194" width="178" height="72" rx="16" fill="#0c2134" stroke="#31526e"/>
      <circle cx="68" cy="230" r="14" fill="#7cf0b7" fill-opacity="0.9"/>
      <path d="M63 230l4 4 8-9" fill="none" stroke="#06131d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="92" y="217" width="94" height="8" rx="4" fill="#d7e7f2" fill-opacity="0.78"/>
      <rect x="92" y="234" width="72" height="7" rx="3.5" fill="#71899c" fill-opacity="0.5"/>
      <circle cx="263" cy="230" r="14" fill="#6cc8ff" fill-opacity="0.9"/>
      <path d="M257 230h12M263 224v12" stroke="#06131d" stroke-width="3" stroke-linecap="round"/>
      <rect x="287" y="217" width="94" height="8" rx="4" fill="#d7e7f2" fill-opacity="0.78"/>
      <rect x="287" y="234" width="70" height="7" rx="3.5" fill="#71899c" fill-opacity="0.5"/>
      <path d="M-26 320h508l-36 32H10l-36-32Z" fill="#151f2a" stroke="#4f687d"/>
    </g>

    <g transform="translate(350 150)">
      <rect width="150" height="290" rx="30" fill="#0a1018" stroke="#5b7c94"/>
      <rect x="10" y="12" width="130" height="266" rx="23" fill="#0b1b2d"/>
      <rect x="54" y="20" width="42" height="6" rx="3" fill="#52687a"/>
      <circle cx="32" cy="66" r="14" fill="#6cc8ff" fill-opacity="0.9"/>
      <rect x="54" y="56" width="60" height="8" rx="4" fill="#e6f4ff" fill-opacity="0.86"/>
      <rect x="54" y="73" width="43" height="7" rx="3.5" fill="#6f879a" fill-opacity="0.55"/>
      <rect x="24" y="109" width="102" height="64" rx="16" fill="#10273c" stroke="#2e526d"/>
      <rect x="36" y="123" width="76" height="8" rx="4" fill="#9fcae6" fill-opacity="0.75"/>
      <rect x="36" y="141" width="58" height="7" rx="3.5" fill="#6d879b" fill-opacity="0.55"/>
      <rect x="24" y="188" width="88" height="44" rx="15" fill="url(#accent)"/>
      <rect x="24" y="247" width="102" height="16" rx="8" fill="#132a3e" stroke="#2f5068"/>
